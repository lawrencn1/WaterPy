name: Build & Package App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm main.spec

      - name: Compress macOS .app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/WaterPy.app dist/WaterPy-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaterPy-macOS
          path: dist/WaterPy-macOS.zip
          retention-days: 30

      - name: Create Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WaterPy-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Exe
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --noconfirm main.spec

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaterPy-Windows
          path: dist/WaterPy.exe
          retention-days: 30

      - name: Create Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WaterPy.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
